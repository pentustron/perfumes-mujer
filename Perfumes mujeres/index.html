<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:
linear-gradient(
rgba(30,20,40,.92),
rgba(15,10,25,.95)
),
url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1');
background-size:cover;
background-attachment:fixed;
color:white;
min-height:100vh;
}
header{
padding:40px 20px;
text-align:center;
}

header h1{
font-size:3rem;
font-weight:700;
letter-spacing:2px;
}

header p{
color:#9ca3af;
margin-top:10px;
}

.container{
width:95%;
max-width:1500px;
margin:auto;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
margin-bottom:40px;
}

.search{
width:350px;
max-width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#111827;
color:white;
font-size:1rem;
outline:none;
}

.filter{
padding:15px;
border:none;
border-radius:15px;
background:#111827;
color:white;
cursor:pointer;
}

.category{
margin-bottom:50px;
}

.category h2{
font-size:1.8rem;
margin-bottom:20px;
padding:15px 25px;
border-radius:15px;
display:inline-block;
}

.fresco{
background:linear-gradient(135deg,#0ea5e9,#2563eb);
}
.frutal{
background:linear-gradient(135deg,#ff7b54,#ff416c);
}
.dulce{
background:linear-gradient(135deg,#f97316,#dc2626);
}

.noche{
background:linear-gradient(135deg,#7c3aed,#312e81);
}

.lujo{
background:linear-gradient(135deg,#d4af37,#a16207);
color:black;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:rgba(17,24,39,.85);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 20px 35px rgba(0,0,0,.4);
}

.card-image{
height:320px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,#1f2937,#111827);
padding:20px;
}

.card-image img{
max-width:100%;
max-height:280px;
object-fit:contain;
transition:.4s;
filter:drop-shadow(0 15px 20px rgba(0,0,0,.5));
}

.card:hover .card-image img{
transform:scale(1.08);
}
.card-content{
padding:20px;
}

.card h3{
margin-bottom:15px;
font-size:1.3rem;
}

.info{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.tag{
padding:5px 12px;
border-radius:30px;
font-size:.8rem;
font-weight:600;
}

.temporada{
background:#2563eb;
}

.ocasion{
background:#16a34a;
}

.edad{
background:#dc2626;
.price{
background:#f59e0b;
color:black;
font-weight:700;
}

.duration{
background:#0891b2;
}

.projection{
background:#7c3aed;
}

.best-seller{
position:absolute;
top:15px;
right:15px;
background:#f59e0b;
color:black;
font-size:.8rem;
font-weight:700;
padding:6px 12px;
border-radius:30px;
z-index:5;
}

.whatsapp-btn{
display:block;
width:100%;
margin-top:15px;
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#ff4d88,#ff8fb1);color:white;
font-weight:600;
cursor:pointer;
text-decoration:none;
text-align:center;
transition:.3s;
}

.whatsapp-btn:hover{
transform:translateY(-2px);
}

.card{
position:relative;
background:rgba(17,24,39,.88);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
transition:.3s;
}
}

footer{
text-align:center;
padding:40px;
color:#6b7280;
}

.no-result{
text-align:center;
font-size:1.2rem;
display:none;
margin-top:30px;
}

</style>
</head>

<body>

<header>

<h1> 🌸 CATÁLOGO PREMIUM DAMA 🌸</h1>

<p>
Encuentra tu fragancia ideal por aroma, ocasión y personalidad.
</p>

</header>

<div class="container">

<div class="controls">

<input
type="text"
id="searchInput"
class="search"
placeholder="Buscar perfume..."
>

<select id="filterCategory" class="filter">
<option value="all">Todas las categorías</option>
<option value="fresco">Frescos</option>
<option value="frutal">Frutales</option>
<option value="dulce">Dulces</option>
<option value="noche">Noche</option>
<option value="lujo">Lujo</option>
</select>

</div>

<div id="perfumeContainer">

<!-- AQUÍ SE CARGAN LOS PERFUMES AUTOMÁTICAMENTE -->

</div>

<div class="no-result" id="noResult">
No se encontraron perfumes.
</div>

</div>

<footer>


</footer>

<script>

const container = document.getElementById("perfumeContainer");
const searchInput = document.getElementById("searchInput");
const filterCategory = document.getElementById("filterCategory");

function renderPerfumes(data){

container.innerHTML = "";

const categories = {

fresco:{
title:"🍋 Frescos y Limpios",
class:"fresco"
},

frutal:{
title:"🍓 Frutales y Juveniles",
class:"frutal"
},

dulce:{
title:"🍭 Dulces & Gourmand",
class:"dulce"
},

noche:{
title:"👠 Noche & Seducción",
class:"noche"
},

lujo:{
title:"👑 Lujo y Exclusivos",
class:"lujo"
}

};

Object.keys(categories).forEach(cat=>{

const perfumes=data.filter(
p=>p.category===cat
);

if(perfumes.length===0) return;

let html=`

<section class="category">

<h2 class="${categories[cat].class}">
${categories[cat].title}
</h2>

<div class="grid">

`;

perfumes.forEach(p=>{

html+=`

<div class="card">

${p.bestSeller ? `
<div class="best-seller">
🏆 Más Vendido
</div>
` : ''}

<div class="card-image">
<img src="${p.image}" alt="${p.name}">
</div>

<div class="card-content">

<h3>${p.name}</h3>

<div class="info">
<span>Edad</span>
<span class="tag edad">${p.age}</span>
</div>

<div class="info">
<span>Temporada</span>
<span class="tag temporada">${p.season}</span>
</div>

<div class="info">
<span>Ocasión</span>
<span class="tag ocasion">${p.occasion}</span>
</div>

<div class="info">
<span>Duración</span>
<span class="tag duration">${p.duration}</span>
</div>

<div class="info">
<span>Proyección</span>
<span class="tag projection">${p.projection}</span>
</div>



<a
class="whatsapp-btn"
href="https://wa.me/5213344597120?text=Hola,%20vi%20tu%20catálogo%20y%20me%20interesa%20${encodeURIComponent(p.name)}.%20¿Podrías%20darme%20más%20información?"
target="_blank"
>
📲 Solicitar Información
</a>


</div>

</div>

`;

});

html+=`
</div>
</section>
`;

container.innerHTML += html;

});

}

function filterPerfumes(){

const search=searchInput.value.toLowerCase();

const category=filterCategory.value;

const filtered=perfumes.filter(p=>{

const matchName=
p.name.toLowerCase().includes(search);

const matchCategory=
category==="all"
||
p.category===category;

return matchName && matchCategory;

});

renderPerfumes(filtered);

document.getElementById("noResult").style.display=
filtered.length===0
?
"block"
:
"none";

}

searchInput.addEventListener(
"keyup",
filterPerfumes
);

filterCategory.addEventListener(
"change",
filterPerfumes
);

</script>

<script src="perfumes.js"></script>

</body>
</html>
